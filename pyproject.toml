[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-aggregator-workflow"
version = "0.1.0"
description = "Standalone Python orchestration for the Agentic Aggregator real-time workflow"
requires-python = ">=3.10"
dependencies = [
  "flask",
  "highspy",
  "httpx",
  "numpy",
  "openai",
  "openpyxl",
  "pandas",
  "pydantic>=2",
  "pyomo",
]

[project.optional-dependencies]
gurobi = ["gurobipy==13.0.2"]

[project.scripts]
agentic-aggregator = "agentic_workflow.cli:main"

[tool.setuptools]
packages = ["agentic_workflow"]
py-modules = ["app_rt"]

[tool.setuptools.package-data]
agentic_workflow = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
